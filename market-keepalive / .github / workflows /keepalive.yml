name: Market-hours keep-alive

# NSE/BSE market hours 09:15-15:30 IST = 03:45-10:00 UTC (Mon-Fri).
# A single GitHub job may run at most 6 h, so the day is split into two
# back-to-back jobs. `concurrency` queues the 2nd behind the 1st, so there
# is never an overlap (an overlap would mean two browser sessions at once).
on:
  schedule:
    - cron: "30 3 * * 1-5"   # 09:00 IST  -> part 1
    - cron: "20 9 * * 1-5"   # 14:50 IST  -> part 2 (queued behind part 1 if still running)
  workflow_dispatch:
    inputs:
      minutes:
        description: "How many minutes to keep the app open (manual test)"
        default: "10"

concurrency:
  group: streamlit-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Decide window length
        id: win
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "minutes=${{ github.event.inputs.minutes }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 3 * * 1-5" ]; then
            echo "minutes=345" >> "$GITHUB_OUTPUT"   # ~09:00 -> ~14:50 IST
          else
            echo "minutes=60" >> "$GITHUB_OUTPUT"    # ~14:50 -> ~15:50 IST
          fi
      - name: Keep the app open
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: python scripts/keepalive.py --url "$APP_URL" --minutes "${{ steps.win.outputs.minutes }}"
